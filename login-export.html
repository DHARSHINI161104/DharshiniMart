<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | DharshiniMart</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/mart.css">
</head>
<body>

<header>
    <nav class="navbar">
        <div class="container nav-inner">
            <a class="brand" href="/">Dharshini<span>Mart</span></a>
            <div class="nav-links">
                
                    <a href="/">Home</a>
                    <a href="/login">Login</a>
                    <a class="btn btn-primary btn-sm" href="/register">Register</a>
                
                
            </div>
        </div>
    </nav>
</header>

<main class="container auth-wrap">
    <form class="auth-card" action="/login" method="post">

        <h2>Login</h2>

        
        
        

        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" required name="email" value="">
        

        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Your password" required name="password" value="">
        

        <button class="btn btn-primary btn-block" type="submit">Login</button>

        <p class="auth-alt">Don't have an account? <a href="/register">Register here</a></p>
        <p class="auth-demo">Demo admin: <code>admin@dharshinimart.com</code> / <code>admin123</code></p>
    </form>
</main>

</body>
</html>
