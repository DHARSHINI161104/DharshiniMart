<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Order Confirmed')}"></head>
<body>
<header th:replace="~{fragments :: navbar(${user})}"></header>
<main class="container">
  <div class="confirm-box">
    <div class="tick">✓</div>
    <h2 style="color:#00b894">Order Placed Successfully!</h2>
    <p style="color:#636e72;margin:8px 0">Thank you for shopping at <strong>Dharshini Mart</strong></p>
    <p>Order ID: <strong th:text="'#' + ${order.id}">#1</strong> • Status: <span class="order-status" th:classappend="${order.status}" th:text="${order.status}">CONFIRMED</span></p>
    <div style="text-align:left;background:#f8f9fa;padding:16px;border-radius:10px;margin:16px 0">
      <div th:each="item : ${order.items}" style="display:flex;justify-content:space-between;padding:6px 0">
        <span th:text="${item.product.name} + ' × ' + ${item.quantity} + ' ' + ${item.unit}">Tomato × 2 kg</span>
        <span th:text="'₹' + ${item.totalPrice}">₹80</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-weight:800;border-top:1px solid #dfe6e9;padding-top:8px;margin-top:8px">
        <span>Total Paid</span><span style="color:#00b894" th:text="'₹' + ${order.totalAmount}">₹405</span>
      </div>
      <div style="margin-top:10px;font-size:0.9rem;color:#636e72">
        <div>Customer: <span th:text="${order.customerName}">Name</span> • <span th:text="${order.mobile}">Mobile</span></div>
        <div>Address: <span th:text="${order.deliveryAddress}">Address</span></div>
        <div>Date: <span th:text="${#temporals.format(order.createdAt,'dd MMM yyyy HH:mm')}">date</span></div>
      </div>
    </div>
    <div style="display:flex;gap:10px;justify-content:center">
      <a th:href="@{/orders}" class="btn btn-primary" style="text-decoration:none">View Orders</a>
      <a th:href="@{/dashboard}" class="btn" style="background:#dfe6e9;color:#2d3436;text-decoration:none;padding:10px 18px;border-radius:6px">Continue Shopping</a>
    </div>
  </div>
</main>
</body>
</html>
