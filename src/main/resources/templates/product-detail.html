<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${product.name})}"></head>
<body>
<header th:replace="~{fragments :: navbar(${user})}"></header>
<main class="container">
  <a th:href="@{/dashboard}" style="display:inline-block;margin-top:16px;color:#6c5ce7;text-decoration:none">← Back to Dashboard</a>
  <div th:if="${error}" class="mart-alert out" th:text="${error}"></div>
  <div class="pd-wrap">
    <div class="pd-image" th:text="${product.image}">🍎</div>
    <div class="pd-info">
      <div class="pd-cat" th:text="${product.category.displayName}">Fruits</div>
      <h1 th:text="${product.name}">Tomato</h1>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="pd-price" th:text="'₹' + ${product.discount > 0 ? product.discountedPrice : product.price} + ' / ' + ${product.unit}">₹40 / kg</span>
        <span th:if="${product.discount > 0}" class="pd-mrp" th:text="'₹' + ${product.price}">₹50</span>
        <span th:if="${product.discount > 0}" class="pc-discount" th:text="${product.discount}+'% OFF'">10% OFF</span>
      </div>
      <div class="pc-stock" th:classappend="${product.stockStatusClass}" style="margin:8px 0;font-size:1rem" th:text="${product.stockStatus} + ' • Available: ' + ${product.stock} + ' ' + ${product.unit}"></div>
      <div th:if="${product.stock > 0 and product.stock <= product.minStock}" class="mart-alert low">⚠️ Low Stock Alert — Only <span th:text="${product.stock}">5</span> <span th:text="${product.unit}">kg</span> left!</div>
      <div th:if="${product.stock <= 0}" class="mart-alert out">❌ Out of Stock — Currently unavailable</div>
      <p class="pd-desc" th:text="${product.description}">Fresh</p>
      <div style="display:flex;gap:10px;align-items:center;margin:14px 0" th:text="'Category: ' + ${product.category.displayName} + ' • Product ID: #' + ${product.id}"></div>
      <form th:action="@{/cart/add}" method="post" style="display:flex;gap:10px;align-items:center">
        <input type="hidden" name="productId" th:value="${product.id}">
        <label>Qty:</label>
        <input type="number" name="quantity" value="1" min="1" th:max="${product.stock > 0 ? product.stock : 1}" style="width:80px;padding:10px;border:1px solid #dfe6e9;border-radius:8px">
        <span th:text="${product.unit}">kg</span>
        <button class="btn btn-primary" type="submit" th:disabled="${product.stock <= 0}" th:text="${product.stock <= 0 ? 'Out of Stock' : 'Add to Cart'}">Add to Cart</button>
      </form>
      <div style="margin-top:16px;display:flex;gap:10px">
        <a th:href="@{/cart}" class="btn" style="background:#00b894;color:#fff;padding:10px 18px;border-radius:8px;text-decoration:none">View Cart (<span th:text="${cartCount}">0</span>)</a>
        <a th:href="@{/dashboard}" class="btn" style="background:#dfe6e9;color:#2d3436;padding:10px 18px;border-radius:8px;text-decoration:none">Continue Shopping</a>
      </div>
    </div>
  </div>
</main>
</body>
</html>
