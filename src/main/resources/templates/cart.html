<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Cart')}"></head>
<body>
<header th:replace="~{fragments :: navbar(${user})}"></header>
<main class="container">
  <h2 style="color:#0e153a;margin:18px 0">🛒 Your Shopping Cart</h2>
  <div th:if="${items.isEmpty()}" class="confirm-box">
    <div class="tick" style="background:#dfe6e9;color:#636e72">🛒</div>
    <h3>Your cart is empty</h3>
    <p style="color:#636e72;margin:8px 0">Add some fresh groceries to get started!</p>
    <a th:href="@{/dashboard}" class="btn btn-primary" style="text-decoration:none">Browse Products</a>
  </div>

  <div th:if="${!items.isEmpty()}" style="display:grid;grid-template-columns:1fr 360px;gap:20px">
    <div>
      <table class="cart-table">
        <thead><tr><th>Product</th><th>Unit Price</th><th>Qty</th><th>Total</th><th></th></tr></thead>
        <tbody>
          <tr th:each="it : ${items}">
            <td>
              <div style="display:flex;gap:10px;align-items:center">
                <span style="font-size:1.6rem" th:text="${it.product.image}">🍎</span>
                <div>
                  <div style="font-weight:700" th:text="${it.product.name}">Tomato</div>
                  <div style="font-size:0.8rem;color:#636e72" th:text="${it.product.category.displayName}">Veg</div>
                  <div th:if="${it.product.discount > 0}" style="font-size:0.75rem;color:#ff7675" th:text="${it.product.discount}+'% OFF'"></div>
                </div>
              </div>
            </td>
            <td>
              <span th:text="'₹' + ${it.product.discountedPrice}">₹40</span>
              <span th:if="${it.product.discount>0}" style="text-decoration:line-through;color:#b2bec3;font-size:0.8rem" th:text="'₹'+${it.product.price}"></span>
              <div style="font-size:0.8rem;color:#636e72" th:text="'/' + ${it.product.unit}"></div>
            </td>
            <td>
              <form th:action="@{/cart/update}" method="post" class="qty-inline">
                <input type="hidden" name="productId" th:value="${it.product.id}">
                <input type="number" name="quantity" th:value="${it.quantity}" min="0" style="width:60px;padding:6px;border:1px solid #dfe6e9;border-radius:6px">
                <button class="btn-sm-mini btn-stock" type="submit">Update</button>
              </form>
            </td>
            <td style="font-weight:700" th:text="'₹' + ${it.lineTotal}">₹80</td>
            <td>
              <form th:action="@{/cart/remove}" method="post"><input type="hidden" name="productId" th:value="${it.product.id}"><button class="btn-sm-mini btn-delete" type="submit">Remove</button></form>
            </td>
          </tr>
        </tbody>
      </table>
      <form th:action="@{/cart/clear}" method="post" style="margin-top:10px"><button class="btn" style="background:#ff7675;color:#fff;border:none;padding:8px 14px;border-radius:6px">Clear Cart</button></form>
    </div>

    <div class="cart-summary">
      <h3>Order Summary</h3>
      <div class="summary-row"><span>Subtotal</span><span th:text="'₹'+${subtotal}">₹405</span></div>
      <div class="summary-row"><span>Discount</span><span style="color:#00b894" th:text="'-₹'+${discount}">-₹0</span></div>
      <div class="summary-row total"><span>Total</span><span th:text="'₹'+${total}">₹405</span></div>
      <a th:href="@{/checkout}" class="btn-checkout" style="display:block;text-align:center;text-decoration:none">Proceed to Checkout →</a>
      <a th:href="@{/dashboard}" style="display:block;text-align:center;margin-top:10px;color:#6c5ce7;text-decoration:none">Continue Shopping</a>
    </div>
  </div>
</main>
</body>
</html>
