spring.application.name=DharshiniMart

# ---- PostgreSQL Database ----
spring.datasource.url=jdbc:postgresql://localhost:5432/dharshinimart
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=root
# Tip: use environment variables in production:
# spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/dharshinimart}
# spring.datasource.username=${POSTGRES_USER:postgres}
# spring.datasource.password=${POSTGRES_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---- Thymeleaf ----
spring.thymeleaf.cache=false

server.port=8080
