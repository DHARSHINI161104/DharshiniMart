spring.application.name=DharshiniMart

# ---- MySQL Database ----
spring.datasource.url=jdbc:mysql://localhost:3306/dharshinimart?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root
# Tip: use environment variables in production:
# spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/dharshinimart?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
# spring.datasource.username=${MYSQL_USER:root}
# spring.datasource.password=${MYSQL_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- Thymeleaf ----
spring.thymeleaf.cache=false

server.port=8080
